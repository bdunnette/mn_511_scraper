name: Daily Camera Update

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at 00:00 UTC (roughly 6 PM Central Time)
  workflow_dispatch:  # Allows manual triggering for testing

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necessary to commit changes to the repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Run Scraping Script
        run: uv run python scrape_cameras.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mn_cameras.csv
          if ! git diff --staged --quiet; then
            git commit -m "chore: nightly update of camera data [automated]"
            git push
          else
            echo "No changes in camera data today."
          fi
